spring.application.name=mcp-apps-server
spring.ai.mcp.server.protocol=streamable
server.port=3001

# Demo audit JSONL (survives restart; not WORM)
audit.log.file=./data/audit-log.jsonl

# Spring AI 2.1+ official Tool Call Confirmation (ChatClient / @Tool path).
# MCP clients keep using ConfirmationGate confirmToken; these props do not replace that gate.
# enabled=true (default): honor @Tool(requiresConfirmation=true) on TreasuryChatTools.
spring.ai.tools.confirmation.enabled=true
# Extra name list (model-visible names) — useful for tools you cannot annotate (e.g. remote MCP).
# Local TreasuryChatTools already sets requiresConfirmation on setAccountNote / demoTransfer.
spring.ai.tools.confirmation.tools=demoTransfer,setAccountNote
